# worlds (QT 오픈월드) — qt.log2u.me
# 방식: 방문자 → Cloudflare(443, 프록시) → Origin Rule로 서버 8443 → nginx → Docker qt-worlds(127.0.0.1:5190)
# 공유기: 외부 TCP 8443 → 192.168.35.50:8443 (443은 열지 않음)
#
# 설치:
#   sudo cp 이 파일 /etc/nginx/sites-available/qt.log2u.me
#   sudo ln -s /etc/nginx/sites-available/qt.log2u.me /etc/nginx/sites-enabled/qt.log2u.me
#   sudo nginx -t && sudo systemctl reload nginx

# 8443 접속 허용 대상: Cloudflare + 내부망 + VPN (프록시 헤더 적용 전의 실제 접속 IP 기준)
# Cloudflare 목록 출처: https://www.cloudflare.com/ips/ (2026-11-08 기준)
geo $realip_remote_addr $qt_origin_allowed {
    default          0;
    127.0.0.1/32     1;
    192.168.35.0/24  1;
    10.20.0.0/24     1;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

server {
    listen 8443 ssl http2;
    server_name qt.log2u.me;

    ssl_certificate     /etc/letsencrypt/live/qt.log2u.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qt.log2u.me/privkey.pem;

    # Cloudflare를 거치지 않은 외부 직접 접속은 거절
    if ($qt_origin_allowed = 0) {
        return 444;
    }

    # Cloudflare 뒤에서 실제 방문자 IP 복원
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;

    # 라이브 Docker 컨테이너 qt-worlds: 정적 클라이언트 + /api + /ws
    location / {
        proxy_pass http://127.0.0.1:5190;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
